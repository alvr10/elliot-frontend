controllers:
  auth:
    base_path: "/api/auth"
    description: "Authentication endpoints for user login, registration and OAuth"
    authentication: "None required"
    endpoints:
      - path: "/google"
        method: "GET"
        summary: "Initiate Google OAuth login"
        responses:
          200:
            description: "Redirect URL for Google OAuth"
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: "Google OAuth redirect URL"
      - path: "/callback"
        method: "GET"
        summary: "Handle Google OAuth callback"
        parameters:
          - name: "code"
            in: "query"
            description: "Authorization code from Google"
            required: true
            type: string
        responses:
          200:
            description: "User authentication successful"
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id: { type: string }
                    email: { type: string }
                    name: { type: string }
                session:
                  type: object
                  description: "Supabase session object"
          400:
            description: "Invalid authorization code"
            schema:
              type: object
              properties:
                message: { type: string }
                error: { type: string }
                statusCode: { type: number }
      - path: "/register"
        method: "POST"
        summary: "Register a new user with email and password"
        request_body:
          required: true
          schema:
            type: object
            required: ["email", "password", "name"]
            properties:
              email:
                type: string
                format: email
                description: "User's email address"
              password:
                type: string
                minLength: 6
                description: "User's password"
              name:
                type: string
                description: "User's display name"
        responses:
          201:
            description: "User registered successfully"
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id: { type: string }
                    email: { type: string }
                    name: { type: string }
                session:
                  type: object
                  description: "Supabase session object"
          400:
            description: "Registration failed (email already exists, invalid data)"
            schema:
              type: object
              properties:
                message: { type: string }
                error: { type: string }
                statusCode: { type: number }
      - path: "/login"
        method: "POST"
        summary: "Login with email and password"
        request_body:
          required: true
          schema:
            type: object
            required: ["email", "password"]
            properties:
              email:
                type: string
                format: email
                description: "User's email address"
              password:
                type: string
                description: "User's password"
        responses:
          200:
            description: "Login successful"
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    id: { type: string }
                    email: { type: string }
                    name: { type: string }
                session:
                  type: object
                  description: "Supabase session object"
          400:
            description: "Invalid credentials"
            schema:
              type: object
              properties:
                message: { type: string }
                error: { type: string }
                statusCode: { type: number }

  admin:
    base_path: "/api/admin"
    description: "Administrative endpoints for system statistics and management"
    authentication: "Bearer token with admin privileges required"
    guard: "AdminGuard"
    endpoints:
      - path: "/stats"
        method: "GET"
        summary: "Get all admin statistics"
        responses:
          200:
            description: "Admin statistics retrieved successfully"
            schema:
              type: object
              properties:
                totalUsers: { type: number }
                totalSubscriptions: { type: number }
                totalRevenue: { type: number }
                recentSignups: { type: number }
          401: "Unauthorized - Invalid or missing admin token"
      - path: "/users"
        method: "GET"
        summary: "Get user statistics"
        responses:
          200:
            description: "User statistics retrieved successfully"
            schema:
              type: object
              properties:
                totalUsers: { type: number }
                activeUsers: { type: number }
                newUsersThisMonth: { type: number }
      - path: "/subscriptions"
        method: "GET"
        summary: "Get subscription statistics"
        responses:
          200:
            description: "Subscription statistics retrieved successfully"
            schema:
              type: object
              properties:
                totalSubscriptions: { type: number }
                activeSubscriptions: { type: number }
                cancelledSubscriptions: { type: number }
      - path: "/revenue"
        method: "GET"
        summary: "Get revenue statistics"
        responses:
          200:
            description: "Revenue statistics retrieved successfully"
            schema:
              type: object
              properties:
                totalRevenue: { type: number }
                monthlyRevenue: { type: number }
                averageRevenuePerUser: { type: number }
      - path: "/signups"
        method: "GET"
        summary: "Get recent signups"
        parameters:
          - name: "days"
            in: "query"
            description: "Number of days to look back"
            required: false
            type: integer
            example: 7
        responses:
          200:
            description: "Recent signups retrieved successfully"
            schema:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  createdAt: { type: string, format: date-time }

  caffeine:
    base_path: "/api/caffeine"
    description: "Caffeine intake tracking endpoints"
    authentication: "Bearer token required"
    guard: "AuthGuard"
    endpoints:
      - path: "/log-intake"
        method: "POST"
        summary: "Log caffeine intake"
        request_body:
          required: true
          schema:
            type: object
            required: ["drinkId", "servings"]
            properties:
              drinkId:
                type: string
                description: "ID of the drink consumed"
              servings:
                type: number
                minimum: 0.1
                description: "Number of servings consumed"
              consumedAt:
                type: string
                format: date-time
                description: "Optional timestamp of consumption"
        responses:
          201:
            description: "Intake logged successfully"
            schema:
              type: object
              properties:
                id: { type: string }
                drinkId: { type: string }
                servings: { type: number }
                consumedAt: { type: string, format: date-time }
          400: "Invalid request data"
          401: "Unauthorized"
      - path: "/intake"
        method: "GET"
        summary: "Get caffeine intake history"
        parameters:
          - name: "period"
            in: "query"
            description: "Time period for intake data"
            required: false
            type: string
            enum: ["daily", "weekly", "monthly", "yearly"]
          - name: "date"
            in: "query"
            description: "Specific date for intake data"
            required: false
            type: string
            format: date
        responses:
          200:
            description: "Intake history retrieved successfully"
            schema:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  drinkId: { type: string }
                  servings: { type: number }
                  consumedAt: { type: string, format: date-time }
                  caffeineMg: { type: number }
          401: "Unauthorized"
      - path: "/daily-limit"
        method: "GET"
        summary: "Get user's daily caffeine limit"
        responses:
          200:
            description: "Daily limit retrieved successfully"
            schema:
              type: object
              properties:
                dailyLimitMg: { type: number }
                recommendedLimitMg: { type: number }
          401: "Unauthorized"

  subscription:
    base_path: "/api/subscription"
    description: "Subscription management endpoints (RevenueCat integration planned)"
    authentication: "Bearer token required"
    guard: "AuthGuard and SubscriptionGuard"
    endpoints:
      - path: "/"
        method: "POST"
        summary: "Create a new subscription (beta: free, post-beta: RevenueCat)"
        request_body:
          required: true
          schema:
            type: object
            required: ["planId"]
            properties:
              planId:
                type: string
                description: "ID of the subscription plan"
        responses:
          201:
            description: "Subscription activated for beta"
            schema:
              type: object
              properties:
                message: { type: string }
                userId: { type: string }
                planId: { type: string }
                subscriptionType: { type: string }
          400: "Invalid plan ID or user not found"
          401: "Unauthorized"
          403: "Subscription required (when beta ends)"
      - path: "/cancel"
        method: "POST"
        summary: "Cancel user's subscription (not available during beta)"
        responses:
          200:
            description: "Cancellation response"
            schema:
              type: object
              properties:
                message: { type: string }
                userId: { type: string }
          401: "Unauthorized"
      - path: "/status"
        method: "GET"
        summary: "Get subscription status"
        responses:
          200:
            description: "Subscription status retrieved successfully"
            schema:
              type: object
              properties:
                userId: { type: string }
                status: { type: string, enum: ["active", "inactive"] }
                type: { type: string, enum: ["beta", "monthly", "yearly"] }
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time }
          401: "Unauthorized"
          404: "User not found"
