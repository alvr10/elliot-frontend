auth:
  base_path: "/api/v1/auth"
  description: "Authentication endpoints for user login, registration and OAuth"
  authentication: "None required"
  endpoints:
    - path: "/google"
      method: "GET"
      summary: "Initiate Google OAuth login"
      responses:
        200:
          description: "Redirect URL for Google OAuth"
          schema:
            type: object
            properties:
              url:
                type: string
                description: "Google OAuth redirect URL"
    - path: "/callback"
      method: "GET"
      summary: "Handle Google OAuth callback"
      parameters:
        - name: "code"
          in: "query"
          description: "Authorization code from Google"
          required: true
          type: string
      responses:
        200:
          description: "User authentication successful"
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string }
              session:
                type: object
                description: "Supabase session object"
        400:
          description: "Invalid authorization code"
          schema:
            type: object
            properties:
              message: { type: string }
              error: { type: string }
              statusCode: { type: number }
    - path: "/register"
      method: "POST"
      summary: "Register a new user with email and receive magic link"
      request_body:
        required: true
        schema:
          type: object
          required: ["email", "name"]
          properties:
            email:
              type: string
              format: email
              description: "User's email address"
            name:
              type: string
              description: "User's display name"
      responses:
        200:
          description: "Magic link sent to email"
          schema:
            type: object
            properties:
              message:
                type: string
                description: "Confirmation message"
        400:
          description: "Registration failed (email already exists, invalid data)"
          schema:
            type: object
            properties:
              message: { type: string }
              error: { type: string }
              statusCode: { type: number }
    - path: "/login"
      method: "POST"
      summary: "Login with email and receive magic link"
      request_body:
        required: true
        schema:
          type: object
          required: ["email"]
          properties:
            email:
              type: string
              format: email
              description: "User's email address"
      responses:
        200:
          description: "Magic link sent to email"
          schema:
            type: object
            properties:
              message:
                type: string
                description: "Confirmation message"
        400:
          description: "Failed to send magic link"
          schema:
            type: object
            properties:
              message: { type: string }
              error: { type: string }
              statusCode: { type: number }
    - path: "/verify"
      method: "GET"
      summary: "Verify magic link and authenticate user"
      parameters:
        - name: "token"
          in: "query"
          description: "Verification token from magic link"
          required: true
          type: string
      responses:
        200:
          description: "Authentication successful"
          schema:
            type: object
            properties:
              user:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
                  name: { type: string }
              session:
                type: object
                description: "Supabase session object"
        400:
          description: "Invalid or expired token"
          schema:
            type: object
            properties:
              message: { type: string }
              error: { type: string }
              statusCode: { type: number }
